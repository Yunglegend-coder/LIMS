databases:
  - name: poultry-lims-test-db
    plan: free
    databaseName: poultry_lims
    user: poultry_lims

services:
  - type: web
    name: poultry-lims-test
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: python -m gunicorn lims.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /accounts/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: poultry-lims-test-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: SITE_BASE_URL
        sync: false
