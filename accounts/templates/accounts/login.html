<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Poultry LIMS</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f7; color: #17212b; }
        main { width: min(390px, calc(100% - 40px)); box-sizing: border-box; padding: 32px; background: white; border-radius: 12px; box-shadow: 0 8px 28px #122b4418; }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { color: #586574; margin: 0 0 24px; }
        label { display: block; margin: 16px 0 6px; font-weight: 600; }
        input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #cbd3dc; border-radius: 6px; font-size: 16px; }
        button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 6px; color: white; background: #1769aa; font-size: 16px; font-weight: 600; cursor: pointer; }
        .error { padding: 10px 12px; background: #fff0f0; color: #a32222; border-radius: 6px; }
    </style>
</head>
<body>
<main>
    <h1>Poultry Diagnostic LIMS</h1>
    <p>Sign in with your laboratory account.</p>
    {% if form.errors %}<div class="error" role="alert">Username or password is incorrect.</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
