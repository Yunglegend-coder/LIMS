{% extends "base.html" %}

{% block content %}

<div class="app-content">

    <div class="container-fluid">

        <div class="card">

            <div class="card-header">

                <h3>{{ page_title }}</h3>

            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {% block form_content %}

                    {% endblock %}

                    <hr>

                    <button class="btn btn-success">

                        Save

                    </button>

                    <a href="{{ cancel_url }}"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
